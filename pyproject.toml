[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Md.Sajid Ahammed", email = "mrsanjs7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "chromadb>=1.5.9",
    "google-genai>=2.34.0",
    "isort>=9.0.2",
    "langchain>=1.4.8",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.3",
    "langchain-pinecone>=0.2.13",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langsmith>=0.14.17",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.36",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
